name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

jobs:
  lint:
    name: Build
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          cache: true

          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0
          args: --timeout=5m

      - name: Run tests
        run: make test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: success()
        with:
          files: ./coverage.out
          flags: unittests
          name: codecov-umbrella

      - name: Build and verify generated sources
        run: |
          make build verify-installer
          git diff --exit-code
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            printf 'Uncommitted generated files:\n%s\n' "$untracked"
            exit 1
          fi
  build:
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    name: Publish image
    runs-on: depot-ubuntu-24.04-4
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gosuda/portal-expose-controller
          tags: |
            type=sha,prefix=

      - name: Build and push Docker image
        id: image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - lint
  promote-latest:
    name: Promote current main image
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: depot-ubuntu-24.04-4
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: portal-expose-latest-image
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote only the current main revision
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping latest promotion because main has advanced."
            exit 0
          fi
          docker buildx imagetools create \
            --tag ghcr.io/gosuda/portal-expose-controller:latest \
            "ghcr.io/gosuda/portal-expose-controller@$IMAGE_DIGEST"
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
